<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Experiência profissional"><style>
.in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.nudge{animation:nudge 1.4s ease-in-out infinite}
.shine{animation:shine 6s ease-in-out infinite}
.t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes shine{0%{transform:translateX(-400px)}55%,100%{transform:translateX(1300px)}}
@keyframes draw{to{stroke-dashoffset:0}}
.line{stroke-dasharray:360;stroke-dashoffset:360;animation:draw 1.6s ease-out forwards}</style><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset=".5" stop-color="#0969da" stop-opacity=".08"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect x="1" y="1" width="898" height="358" rx="14"/></clipPath></defs><rect x="1" y="1" width="898" height="358" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><g clip-path="url(#cc)"><rect class="shine" x="0" y="0" width="320" height="360" fill="url(#sh)"/></g><line class="line" x1="44" y1="40" x2="44" y2="326" stroke="#d0d7de" stroke-width="2"/><circle class="pulse" cx="44" cy="48" r="8" fill="#f76707"/><circle class="pop" style="animation-delay:0.3s" cx="44" cy="48" r="8" fill="#f76707" stroke="#f6f8fa" stroke-width="3"/><g class="in" style="animation-delay:0.4s"><text x="74" y="54" class="t" style="font-size:19px;font-weight:700">Fundador e Desenvolvedor</text><text x="74" y="78" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:600" fill="#f76707">Flow / Nexus Informática</text><rect x="751" y="38" width="119" height="26" rx="13" fill="#f76707" fill-opacity=".12" stroke="#f76707" stroke-opacity=".45"/><text x="811" y="55.5" text-anchor="middle" class="mono" style="font-size:12px" fill="#f76707">desde 05/2024</text></g><g class="in" style="animation-delay:0.55s"><circle cx="80" cy="102" r="3" fill="#f76707"/><text x="92" y="106" class="t" style="font-size:14px">Criei sozinho o AgendaFlow: Painel de Controle (CRM), Painel Recepção e bot com IA no WhatsApp</text></g><g class="in" style="animation-delay:0.67s"><circle cx="80" cy="125" r="3" fill="#f76707"/><text x="92" y="129" class="t" style="font-size:14px">App FlowPay em Flutter e pagamentos PIX via Mercado Pago e Asaas, com infraestrutura no Railway</text></g><g class="in" style="animation-delay:0.79s"><circle cx="80" cy="148" r="3" fill="#f76707"/><text x="92" y="152" class="t" style="font-size:14px">Consultoria e suporte de TI para empresas e escritórios, com gestão direta de clientes</text></g><text class="in mono" style="animation-delay:0.90s;font-size:12.5px" x="74" y="183" fill="#0969da">FastAPI · PostgreSQL · Claude API · WhatsApp Cloud API · Flutter</text><circle class="pop" style="animation-delay:1.0s" cx="44" cy="229" r="8" fill="#0969da" stroke="#f6f8fa" stroke-width="3"/><g class="in" style="animation-delay:1.1s"><text x="74" y="235" class="t" style="font-size:19px;font-weight:700">Desenvolvedor Back-end</text><text x="74" y="259" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:600" fill="#0969da">Wooba</text><rect x="693" y="219" width="177" height="26" rx="13" fill="#0969da" fill-opacity=".12" stroke="#0969da" stroke-opacity=".45"/><text x="781" y="236.5" text-anchor="middle" class="mono" style="font-size:12px" fill="#0969da">plataforma de viagens</text></g><g class="in" style="animation-delay:1.25s"><circle cx="80" cy="283" r="3" fill="#0969da"/><text x="92" y="287" class="t" style="font-size:14px">Fluxos independentes de busca de voos e hotéis em produção</text></g><g class="in" style="animation-delay:1.37s"><circle cx="80" cy="306" r="3" fill="#0969da"/><text x="92" y="310" class="t" style="font-size:14px">Correções de roteamento, sincronização do front-end e autenticação com fornecedores</text></g><text class="in mono" style="animation-delay:1.60s;font-size:12.5px" x="74" y="341" fill="#0969da">C# · ASP.NET MVC · APIs REST · JavaScript · jQuery</text></svg>