<svg xmlns="http://www.w3.org/2000/svg" width="290" height="176" viewBox="0 0 290 176" role="img" aria-label="Pokémon API"><style>
.in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.nudge{animation:nudge 1.4s ease-in-out infinite}
.shine{animation:shine 6s ease-in-out infinite}
.t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.m{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes shine{0%{transform:translateX(-400px)}55%,100%{transform:translateX(1300px)}}
@keyframes draw{to{stroke-dashoffset:0}}
.trace{stroke-dasharray:932;stroke-dashoffset:932;animation:draw 1.6s ease-out 0.4s forwards}
.float{animation:fl 3s ease-in-out 0.4s infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}</style><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".08"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient><clipPath id="cc"><rect x="1" y="1" width="288" height="174" rx="14"/></clipPath></defs><rect x="1" y="1" width="288" height="174" rx="14" fill="#161b22" stroke="#30363d"/><g clip-path="url(#cc)"><rect class="shine" x="0" y="0" width="320" height="176" fill="url(#sh)"/></g><rect class="trace" x="1" y="1" width="288" height="174" rx="14" fill="none" stroke="#bc8cff" stroke-width="1.5"/><g class="float"><rect x="20" y="20" width="40" height="40" rx="11" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".5"/><text x="40" y="45.5" text-anchor="middle" class="mono" style="font-size:14px;font-weight:700" fill="#bc8cff">{ }</text></g><g class="in" style="animation-delay:0.5s"><text x="74" y="46" class="t" style="font-size:17px;font-weight:700">Pokémon API</text><text x="20" y="88" class="m" style="font-size:13px">Mesma arquitetura, com endpoint</text><text x="20" y="107" class="m" style="font-size:13px">de batalha e tarefas no Celery</text><text x="20" y="133" class="mono" style="font-size:11.5px" fill="#bc8cff">FastAPI · Celery · Redis</text><line x1="20" y1="146" x2="270" y2="146" stroke="#30363d"/><text x="20" y="165" class="t" style="font-size:12.5px;font-weight:600">ver repositório</text></g><g class="nudge"><path d="M252,160 H266 M260,154 L266,160 L260,166" fill="none" stroke="#bc8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>