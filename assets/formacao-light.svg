t><text x="536" y="78" class="m" style="font-size:12.5px">formação técnica</text><circle cx="850" cy="50" r="12" fill="#1a7f37" fill-opacity=".15" stroke="#1a7f37"/><path class="check" d="M844,50 l4,4 l8,-8" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="82" text-anchor="end" class="mono" style="font-size:11.5px" fill="#1a7f37">concluído</text></g><g class="in" style="animation-delay:0.45s"><rect x="20" y="122" width="422" height="88" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="36" y="142" width="48" height="48" rx="12" fill="#0969da" fill-opacity=".14" stroke="#0969da" stroke-opacity=".5"/><text x="60" y="171" text-anchor="middle" class="mono" style="font-size:12px;font-weight:700" fill="#0969da">EBAC</text><text x="98" y="158" class="t" style="font-size:15.5px;font-weight:700">Formações complementares</text><text x="98" y="180" class="m" style="font-size:12.5px">API, Arquitetura, CI/CD, IA, POO e TDD</text></g><g class="in" style="animation-delay:0.60s"><rect x="458" y="122" width="422" height="88" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="474" y="142" width="48" height="48" rx="12" fill="#8250df" fill-opacity=".14" stroke="#8250df" stroke-opacity=".5"/><text x="498" y="171" text-anchor="middle" class="mono" style="font-size:12px;font-weight:700" fill="#8250df">T.I</text><text x="536" y="158" class="t" style="font-size:15.5px;font-weight:700">T.I do Zero ao Pro</text><text x="536" y="180" class="m" style="font-size:12.5px">Introdução à Programação · Linux</text></g><g class="in" style="animation-delay:.9s"><text x="24" y="250" class="m" style="font-size:13.5px">Estudar faz parte da rotina. Próximos alvos:</text><text x="306" y="250" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:700" fill="#f76707">certificações AWS/Azure e inglês profissional</text></g><g class="nudge"><path d="M848,245 H866 M860,239 L866,245 L860,251" fill="none" s