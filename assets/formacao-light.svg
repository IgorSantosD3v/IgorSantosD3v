<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Formação"><style>
.in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.nudge{animation:nudge 1.4s ease-in-out infinite}
.shine{animation:shine 6s ease-in-out infinite}
.t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes shine{0%{transform:translateX(-400px)}55%,100%{transform:translateX(1300px)}}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{animation:bar 1.8s ease-in-out infinite}@keyframes bar{0%{transform:translateX(-120px)}100%{transform:translateX(330px)}}
