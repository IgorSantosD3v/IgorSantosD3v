<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-label="Flowzinho, mascote animado da Flow, contando piadas">
<style>
.bob{animation:bob 1.1s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 1.1s ease-in-out infinite}
.head{transform-box:fill-box;transform-origin:50% 90%;animation:tilt 4.4s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s ease-in-out infinite}
.wave{transform-origin:222px 288px;animation:wave .9s ease-in-out infinite}
.legL{animation:stepL 1.1s ease-in-out infinite}
.legR{animation:stepR 1.1s ease-in-out infinite}
.joke{opacity:0;transform-box:fill-box;transform-origin:20% 100%;animation:joke 29.4s ease-in-out infinite both}
.bubble{transform-box:fill-box;transform-origin:30% 100%;animation:breathe 2.2s ease-in-out infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.typing circle{animation:typing 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.65}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}91%{transform:scaleY(.08)}94%{transform:scaleY(1)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes stepL{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes stepR{0%,100%{transform:translateY(-5px)}50%{transform:translateY(0)}}
@keyframes joke{0%{opacity:0;transform:scale(.6)}1.14%{opacity:1;transform:scale(1.04)}2.00%{transform:scale(1)}12.86%{opacity:1;transform:scale(1)}14.29%,100%{opacity:0;transform:scale(.92)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<defs>
<radialGradient id="skin" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f6f0ea"/><stop offset="1" stop-color="#e4d8cc"/></radialGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa149"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
<linearGradient id="tail" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffb066" stop-opacity=".85"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".16"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<clipPath id="headclip"><circle cx="185" cy="190" r="86"/></clipPath>
<clipPath id="bodyclip"><rect x="148" y="262" width="76" height="86" rx="36"/></clipPath>
</defs>
<circle cx="185" cy="250" r="165" fill="url(#glow)"/>
<ellipse class="shadow" cx="185" cy="438" rx="66" ry="9" fill="#7a3a0a" fill-opacity=".18"/>
<g class="bob">
<path fill="url(#tail)"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M112,205 C78,188 52,236 8,214 C40,246 80,226 116,222 Z;M112,205 C80,206 50,210 6,236 C44,252 84,232 116,222 Z;M112,205 C78,188 52,236 8,214 C40,246 80,226 116,222 Z" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></path>
<path fill="url(#band)" fill-opacity=".9"><animate attributeName="d" dur="1.3s" begin="-.4s" repeatCount="indefinite" values="M118,224 C86,240 66,282 22,272 C58,298 96,262 124,240 Z;M118,224 C84,232 60,256 20,292 C62,300 98,258 124,240 Z;M118,224 C86,240 66,282 22,272 C58,298 96,262 124,240 Z" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></path>
<g class="legL"><rect x="156" y="330" width="28" height="62" rx="14" fill="url(#skin)" stroke="#e3d5c8"/><ellipse cx="168" cy="392" rx="18" ry="9" fill="#f76707"/></g>
<g class="legR"><rect x="190" y="330" width="28" height="62" rx="14" fill="url(#skin)" stroke="#e3d5c8"/><ellipse cx="206" cy="392" rx="18" ry="9" fill="#f76707"/></g>
<ellipse cx="140" cy="300" rx="15" ry="26" transform="rotate(18 140 300)" fill="url(#skin)" stroke="#e3d5c8"/>
<rect x="148" y="262" width="76" height="86" rx="36" fill="url(#skin)" stroke="#e3d5c8"/>
<g clip-path="url(#bodyclip)"><path d="M140,300 L230,262 L234,284 L144,324 Z" fill="url(#band)"/></g>
<g class="wave"><line x1="222" y1="288" x2="268" y2="252" stroke="#e3d5c8" stroke-width="28" stroke-linecap="round"/><line x1="222" y1="288" x2="268" y2="252" stroke="#fbf7f3" stroke-width="26" stroke-linecap="round"/></g>
<g class="head">
<circle cx="185" cy="190" r="86" fill="url(#skin)" stroke="#e3d5c8"/>
<g clip-path="url(#headclip)">
<path d="M92,128 C112,190 196,232 282,188 L282,226 C198,272 104,236 86,170 Z" fill="url(#band)"/>
<path d="M112,112 C150,92 214,98 262,132 L256,146 C212,116 156,110 108,128 Z" fill="url(#band)" fill-opacity=".92"/>
<path d="M104,198 C150,236 214,240 270,206" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
</g>
<path d="M152,149 Q162,142 172,148" fill="none" stroke="#2b1d16" stroke-width="3.5" stroke-linecap="round"/>
<path d="M204,145 Q214,139 224,146" fill="none" stroke="#2b1d16" stroke-width="3.5" stroke-linecap="round"/>
<g class="eye"><ellipse cx="162" cy="172" rx="11" ry="15" fill="#2b1d16"/><circle cx="158" cy="165" r="4" fill="#fff"/><circle cx="165" cy="178" r="1.8" fill="#fff" fill-opacity=".7"/></g>
<g class="eye"><ellipse cx="214" cy="170" rx="11" ry="15" fill="#2b1d16"/><circle cx="210" cy="163" r="4" fill="#fff"/><circle cx="217" cy="176" r="1.8" fill="#fff" fill-opacity=".7"/></g>
<ellipse cx="140" cy="130" rx="18" ry="10" transform="rotate(-30 140 130)" fill="#ffffff" fill-opacity=".7"/>
</g>
</g>
<g class="joke" style="animation-delay:0.0s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Funciona na minha máquina.</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">Vamos mandar ela pro cliente?</text>
</g></g>
<g class="joke" style="animation-delay:4.2s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Meu código não tem bug.</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">Tem funcionalidade surpresa.</text>
</g></g>
<g class="joke" style="animation-delay:8.4s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Deploy na sexta às 18h?</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">Só se for com PIX de coragem.</text>
</g></g>
<g class="joke" style="animation-delay:12.6s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Tenho uma piada de UDP...</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">mas talvez você não receba.</text>
</g></g>
<g class="joke" style="animation-delay:16.8s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">git commit -m "agora vai"</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">Spoiler: não foi.</text>
</g></g>
<g class="joke" style="animation-delay:21.0s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Existem 10 tipos de pessoas:</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">as que entendem binário e as outras.</text>
</g></g>
<g class="joke" style="animation-delay:25.2s"><g class="bubble">
<rect x="14" y="12" width="332" height="62" rx="16" fill="#ffffff" stroke="#f76707" stroke-width="1.5"/>
<path d="M170,73 l14,16 l6,-16 Z" fill="#ffffff" stroke="#f76707" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="171" y="70" width="18" height="5" fill="#ffffff"/>
<text x="32" y="38" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1f2328">Por que o dev foi ao médico?</text>
<text x="32" y="59" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#f76707">Tava com muito cache.</text>
</g></g>
<circle class="dot" cx="113" cy="466" r="4" fill="#f76707"/><text x="123" y="470" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#57606a">flowzinho · contando piada</text>
</svg>