<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Arquitetura do AgendaFlow com fluxo de atendimento e fluxo financeiro">
<style>
.lbl{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:11px;letter-spacing:1.5px;fill:#8b949e}
.nm{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;fill:#e6edf3}
.sb{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:11px;fill:#8b949e}
.flow{stroke-dasharray:3 7;animation:dash 1s linear infinite}
.flowr{stroke-dasharray:3 7;animation:dashr 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-10}}
@keyframes dashr{to{stroke-dashoffset:10}}
.node{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
.lg{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8b949e}
</style>
