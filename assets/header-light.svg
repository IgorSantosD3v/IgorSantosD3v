<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Igor Santos, Back-end Developer e Founder da Flow">
<style>
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.name{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:54px;font-weight:800;letter-spacing:-1px}
.role{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:19px;fill:#1f2328;opacity:0;animation:role 13.0s ease-in-out infinite both}
.caret{animation:blink 1s steps(1) infinite}
.chip{animation:drift 5s ease-in-out infinite}
.chiptxt{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#1f2328}
.pilltxt{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#1f2328}
.sub{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:12px;fill:#57606a;letter-spacing:1px}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes role{0%{opacity:0;transform:translateY(12px)}2.00%{opacity:1;transform:translateY(0)}17.60%{opacity:1;transform:translateY(0)}20.00%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes blink{50%{opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
<radialGradient id="go" cx=".85" cy=".2" r=".6"><stop offset="0" stop-color="#f76707" stop-opacity=".22"/><stop offset="1" stop-color="#f76707" stop-opacity="0"/></radialGradient>
<radialGradient id="gb" cx=".1" cy=".9" r=".6"><stop offset="0" stop-color="#0969da" stop-opacity=".18"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1f2328" fill-opacity=".06"/></pattern>
<linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#1f2328"/><stop offset=".45" stop-color="#1f2328"/><stop offset=".6" stop-color="#e8590c"/><stop offset=".75" stop-color="#1f2328"/><stop offset="1" stop-color="#1f2328"/>
